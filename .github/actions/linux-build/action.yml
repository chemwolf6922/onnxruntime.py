name: 'Build wheels for Linux'
description: 'Build wheels for Linux'
inputs:
  python-root:
    description: 'Path to the Python installation root (e.g. /opt/python/cp313-cp313)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install Python dependencies
      run: |
        ${{ inputs.python-root }}/bin/python -m pip install --upgrade pip
        ${{ inputs.python-root }}/bin/python -m pip install -r requirements.txt
      shell: bash

    - name: Build wheel
      run: |
        cd ${{ github.workspace }}
        rm -rf build dist
        mkdir -p build dist dist-final
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_ROOT_DIR="${{ inputs.python-root }}"
        cmake --build build
      shell: bash

    - name: Repair wheels with auditwheel
      run: |
        cd ${{ github.workspace }}
        for whl in dist/*.whl; do
          auditwheel repair "$whl" -w dist-final || cp "$whl" dist-final/
        done
      shell: bash
