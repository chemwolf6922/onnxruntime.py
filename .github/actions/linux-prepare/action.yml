name: 'Set up Linux build environment'
description: 'Sets up environment for Linux'
runs:
  using: 'composite'
  steps:
    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install GitPython
      run: |
        python -m pip install --upgrade pip
        pip install GitPython
      shell: bash

    - name: Download ONNX Runtime
      run: |
        python get_onnxruntime.py --require-all-platforms
      shell: bash
