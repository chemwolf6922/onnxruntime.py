name: Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build-validation-windows:
    name: Build Validation (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      uses: ./.github/actions/windows-prepare
    
    - name: Build wheels
      uses: ./.github/actions/windows-build
      with:
        python-version: '3.14'

  build-validation-linux:
    name: Build Validation (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      uses: ./.github/actions/linux-prepare
    
    - name: Build wheels
      uses: ./.github/actions/linux-build
      with:
        python-version: '3.14'

  build-validation-macos:
    name: Build Validation (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      uses: ./.github/actions/macos-prepare
    
    - name: Build wheels
      uses: ./.github/actions/macos-build
      with:
        python-version: '3.14'
