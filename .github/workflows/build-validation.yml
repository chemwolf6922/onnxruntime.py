name: Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build-validation-windows:
    name: Build Validation (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      uses: ./.github/actions/windows-prepare
    
    - name: Build wheels
      uses: ./.github/actions/windows-build
      with:
        python-version: '3.14'

    - name: Test wheels
      run: |
        Remove-Item -Recurse -Force onnxruntime
        pip install (Get-ChildItem dist/*.whl | Select-Object -ExpandProperty FullName)
        pytest test/ -v
      shell: powershell

    - name: Upload wheels
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows
        path: dist/*.whl

  build-validation-linux:
    name: Build Validation (Linux)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup build environment
      uses: ./.github/actions/linux-prepare

    - name: Build wheels
      uses: ./.github/actions/linux-build
      with:
        python-root: '/opt/python/cp314-cp314'

    - name: Test wheels
      run: |
        rm -rf onnxruntime
        /opt/python/cp314-cp314/bin/python -m pip install dist/*.whl
        /opt/python/cp314-cp314/bin/python -m pytest test/ -v
      shell: bash

    - name: Upload wheels
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux
        path: dist/*.whl

  build-validation-macos:
    name: Build Validation (macOS)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      uses: ./.github/actions/macos-prepare
    
    - name: Build wheels
      uses: ./.github/actions/macos-build
      with:
        python-version: '3.14'

    - name: Test wheels
      run: |
        rm -rf onnxruntime
        pip install dist/*.whl
        pytest test/ -v
      shell: bash

    - name: Upload wheels
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos
        path: dist/*.whl
